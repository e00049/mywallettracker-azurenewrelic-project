[newrelic]
# license_key and app_name come from environment variables at runtime:
#   NEW_RELIC_LICENSE_KEY, NEW_RELIC_APP_NAME
# Never put the license key in this file — it goes in Key Vault.
monitor_mode = true
log_file = stderr
log_level = info
high_security = false
transaction_tracer.enabled = true
error_collector.enabled = true
distributed_tracing.enabled = true
