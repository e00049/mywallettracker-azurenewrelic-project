server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Health endpoint for AKS probes
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # React Router uses client-side routing — /login and /register don't exist
    # as files on disk, so every unmatched path must fall back to index.html
    # or you get a 404 on page refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets are immutable; cache them hard
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 1000;
}
