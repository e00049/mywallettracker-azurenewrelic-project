apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: mwt-kv-secrets
  namespace: mywallettracker
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "<UAMI_CLIENT_ID>"
    keyvaultName: "<KEYVAULT_NAME>"
    tenantId: "<TENANT_ID>"
    objects: |
      array:
        - |
          objectName: django-secret-key
          objectType: secret
        - |
          objectName: database-url
          objectType: secret
        - |
          objectName: newrelic-license-key
          objectType: secret
  secretObjects:
    - secretName: mwt-secrets
      type: Opaque
      data:
        - objectName: django-secret-key
          key: SECRET_KEY
        - objectName: database-url
          key: DATABASE_URL
        - objectName: newrelic-license-key
          key: NEW_RELIC_LICENSE_KEY
