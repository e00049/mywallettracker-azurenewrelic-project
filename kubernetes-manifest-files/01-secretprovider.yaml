apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: mwt-kv-secrets
  namespace: mywallettracker
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "__WIF_CLIENT_ID__"
    keyvaultName: "mywallettracker-05-kv"
    tenantId: "1fc4aa2e-9a4d-48a5-baf8-76f0c64bdc1e"
    objects: |
      array:
        - |
          objectName: django-secret-key
          objectType: secret
        - |
          objectName: database-url
          objectType: secret
        - |
          objectName: newrelic-license-key
          objectType: secret
  secretObjects:
    - secretName: mwt-secrets
      type: Opaque
      data:
        - objectName: django-secret-key
          key: SECRET_KEY
        - objectName: database-url
          key: DATABASE_URL
        - objectName: newrelic-license-key
          key: NEW_RELIC_LICENSE_KEY
