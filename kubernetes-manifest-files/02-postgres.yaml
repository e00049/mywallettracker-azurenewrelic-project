apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: mywallettracker
spec:
  # Headless service — StatefulSet pods get stable DNS names through this
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: mywallettracker
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: mywallettracker
            - name: POSTGRES_USER
              value: mwtuser
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mwt-secrets
                  key: POSTGRES_PASSWORD
            # Postgres needs a subdirectory, not the mount root
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "mwtuser", "-d", "mywallettracker"]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "mwtuser", "-d", "mywallettracker"]
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits:   {cpu: 500m, memory: 512Mi}
  # volumeClaimTemplates is what makes this a StatefulSet rather than a
  # Deployment — each replica gets its own persistent disk that survives
  # pod restarts and rescheduling
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: managed-csi
        resources:
          requests:
            storage: 5Gi
