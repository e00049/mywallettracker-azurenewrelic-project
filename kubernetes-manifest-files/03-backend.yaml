apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: mywallettracker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      # Wait for Postgres before the app's entrypoint tries to migrate
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - until pg_isready -h postgres -p 5432 -U mwtuser; do echo waiting; sleep 2; done
      containers:
        - name: backend
          image: mwtacrsid.azurecr.io/mywallettracker-backend:v1
          ports:
            - containerPort: 8000
          env:
            - name: DEBUG
              value: "False"
            - name: ALLOWED_HOSTS
              value: "*"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef: {name: mwt-secrets, key: SECRET_KEY}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: mwt-secrets, key: DATABASE_URL}
          readinessProbe:
            httpGet: {path: /api/v1/health/, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/v1/health/, port: 8000}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits:   {cpu: 500m, memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: mywallettracker
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
